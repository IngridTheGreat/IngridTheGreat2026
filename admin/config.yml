backend:
  name: github
  repo: IngridTheGreat/IngridTheGreat2026
  branch: main
publish_mode: editorial_workflow

media_folder: "assets/images"
public_folder: "/assets/images"



collections:


  # ---------------------------------
  # Portfolio Pages
  # ---------------------------------

  - name: "portfolio"
    label: "Portfolio Pages"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"


    fields:

      - label: "Title"
        name: "title"
        widget: "string"


      - label: "Summary"
        name: "summary"
        widget: "text"


      - label: "Category"
        name: "category"
        widget: "string"


      - label: "Content"
        name: "body"
        widget: "markdown"




  # ---------------------------------
  # Profile
  # ---------------------------------

  - name: "profile"
    label: "Profile"
    folder: "content/profile"
    create: true
    slug: "{{slug}}"


    fields:

      - label: "Title"
        name: "title"
        widget: "string"


      - label: "Role"
        name: "role"
        widget: "string"


      - label: "Content"
        name: "body"
        widget: "markdown"




  # ---------------------------------
  # Case Studies
  # ---------------------------------

  - name: "case-studies"
    label: "Case Studies"
    folder: "content/case-studies"
    create: true
    slug: "{{slug}}"


    fields:

      - label: "Title"
        name: "title"
        widget: "string"


      - label: "Organization"
        name: "organization"
        widget: "string"


      - label: "Category"
        name: "category"
        widget: "string"


      - label: "Content"
        name: "body"
        widget: "markdown"
